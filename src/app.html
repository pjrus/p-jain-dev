<!doctype html>
<html lang="en-AU" data-type="software" data-radius="soft" data-buttons="solid" data-motion>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="theme-color" content="#fbfbfa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232456d6%22/><circle cx=%2212%22 cy=%2210%22 r=%222.5%22 fill=%22%23dfdedb%22/><circle cx=%2220%22 cy=%2210%22 r=%222.5%22 fill=%22%23dfdedb%22/><circle cx=%2212%22 cy=%2216%22 r=%222.5%22 fill=%22%23dfdedb%22/><circle cx=%2212%22 cy=%2222%22 r=%222.5%22 fill=%22%23dfdedb%22/><circle cx=%2220%22 cy=%2216%22 r=%221.4%22 fill=%22%23dfdedb%22 opacity=%220.32%22/><circle cx=%2220%22 cy=%2222%22 r=%221.4%22 fill=%22%23dfdedb%22 opacity=%220.32%22/></svg>"
    />
    <link rel="stylesheet" href="%sveltekit.assets%/vendor/scrollcraft/scrollcraft.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('portfolio-theme') === 'dark' ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('m-enter');
        setTimeout(function () {
          document.documentElement.classList.add('m-enter-done');
        }, 700);
      }
    </script>
    <script defer src="%sveltekit.assets%/vendor/scrollcraft/scrollcraft.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
